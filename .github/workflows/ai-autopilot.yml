name: AI Safe Autopilot

on:
  push:
    branches:
      - "ai/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  safe-autopilot:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: kemalcanyapali/ai-safe-autopilot/.github/workflows/safe-autopilot.yml@v1.0.1
    with:
      validation-command: |
        npm install --global pnpm@10.30.1
        pnpm install --frozen-lockfile
        pnpm types:check
        pnpm lint
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
